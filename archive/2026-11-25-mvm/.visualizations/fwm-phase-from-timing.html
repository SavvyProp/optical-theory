<div id="fwm-phase-from-timing">
  <style>
    #fwm-phase-from-timing {
      display: grid;
      gap: var(--font-size-base);
    }
    #fwm-phase-from-timing .timeline {
      display: grid;
      gap: calc(var(--font-size-base) * .4);
    }
    #fwm-phase-from-timing .timeline-axis {
      display: flex;
      justify-content: space-between;
    }
    #fwm-phase-from-timing .timing-bar {
      position: relative;
      height: calc(var(--font-size-base) * 1.3);
      background: var(--muted);
    }
    #fwm-phase-from-timing .data-boundary {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 1px solid var(--muted-foreground);
    }
    #fwm-phase-from-timing .weight-window {
      position: absolute;
      inset-block: 0;
      left: 13.28125%;
      width: 50%;
      background: var(--viz-series-1);
    }
    #fwm-phase-from-timing .phase-chart {
      display: grid;
      gap: calc(var(--font-size-base) * .55);
    }
    #fwm-phase-from-timing .teeth {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: calc(var(--font-size-base) * .35);
    }
    #fwm-phase-from-timing .tooth {
      display: grid;
      justify-items: center;
      gap: calc(var(--font-size-base) * .3);
    }
    #fwm-phase-from-timing .phase-circle {
      position: relative;
      width: calc(var(--font-size-base) * 3);
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 50%;
    }
    #fwm-phase-from-timing .phase-axis {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 1px;
      background: var(--border);
    }
    #fwm-phase-from-timing .phase-arrow {
      position: absolute;
      inset: 0;
      transform: rotate(var(--angle, 0deg));
    }
    #fwm-phase-from-timing .phase-arrow::before {
      content: "";
      position: absolute;
      top: calc(50% - 1px);
      left: 50%;
      width: 37%;
      height: 2px;
      background: var(--viz-series-1);
    }
    #fwm-phase-from-timing .phase-arrow::after {
      content: "";
      position: absolute;
      top: calc(50% - 4px);
      left: 77%;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 7px solid var(--viz-series-1);
    }
  </style>
  <div>
    <label for="fwm-phase-packet" class="form-label">
      Weight packet <span data-packet-number class="tabular-nums">2</span> of 64
    </label>
    <input id="fwm-phase-packet" class="form-range" type="range" min="1" max="64" value="2">
  </div>
  <div class="timeline" role="group" aria-label="Alignment of data periods and the selected weight packet">
    <div class="timeline-axis text-small tabular-nums" data-times>
      <span>20 ps</span><span>40 ps</span><span>60 ps</span>
    </div>
    <div>Input comb · 20 ps periods</div>
    <div class="timing-bar" aria-hidden="true"><span class="data-boundary"></span></div>
    <div>Selected weight packet · 20 ps wide</div>
    <div class="timing-bar" aria-hidden="true"><span class="weight-window"></span></div>
    <div data-offset class="text-small tabular-nums" aria-live="polite">Starts at 25.3125 ps · 5.3125 ps into the data period</div>
  </div>
  <div class="phase-chart" role="group" aria-label="Input phase shifts relative to the first weight packet, measured with respect to tooth zero">
    <div>Input phase shift since packet 1</div>
    <div class="teeth">
      <div class="tooth" data-tooth="0">
        <span>Tooth 0</span>
        <span class="text-small">0 GHz</span>
        <div class="phase-circle" aria-hidden="true">
          <span class="phase-axis"></span><span class="phase-arrow"></span>
        </div>
        <span class="tabular-nums" data-degrees>0°</span>
      </div>
      <div class="tooth" data-tooth="1">
        <span>Tooth 1</span>
        <span class="text-small">+50 GHz</span>
        <div class="phase-circle" aria-hidden="true">
          <span class="phase-axis"></span><span class="phase-arrow" style="--angle: -95.625deg"></span>
        </div>
        <span class="tabular-nums" data-degrees>95.625°</span>
      </div>
      <div class="tooth" data-tooth="16">
        <span>Tooth 16</span>
        <span class="text-small">+800 GHz</span>
        <div class="phase-circle" aria-hidden="true">
          <span class="phase-axis"></span><span class="phase-arrow" style="--angle: -90deg"></span>
        </div>
        <span class="tabular-nums" data-degrees>90°</span>
      </div>
      <div class="tooth" data-tooth="32">
        <span>Tooth 32</span>
        <span class="text-small">+1.60 THz</span>
        <div class="phase-circle" aria-hidden="true">
          <span class="phase-axis"></span><span class="phase-arrow" style="--angle: -180deg"></span>
        </div>
        <span class="tabular-nums" data-degrees>180°</span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById("fwm-phase-from-timing");
      const input = root.querySelector("input");
      const packetNumber = root.querySelector("[data-packet-number]");
      const timeLabels = root.querySelectorAll("[data-times] span");
      const weightWindow = root.querySelector(".weight-window");
      const offsetLabel = root.querySelector("[data-offset]");
      const teeth = root.querySelectorAll("[data-tooth]");
      const dataPeriod = 20;
      const weightPeriod = 25.3125;
      const advancesPerPass = 17;
      const teethCount = 64;

      function draw() {
        const packet = input.valueAsNumber;
        const slot = packet - 1;
        const start = slot * weightPeriod;
        const periodStart = Math.floor(start / dataPeriod) * dataPeriod;
        const offset = start - periodStart;
        packetNumber.textContent = packet;
        timeLabels.forEach((label, index) => {
          label.textContent = `${periodStart + index * dataPeriod} ps`;
        });
        offsetLabel.textContent = `Starts at ${start} ps · ${offset} ps into the data period`;
        weightWindow.style.left = `${100 * offset / (2 * dataPeriod)}%`;
        for (const tooth of teeth) {
          const index = Number(tooth.dataset.tooth);
          const cycles = ((advancesPerPass * slot * index) % teethCount) / teethCount;
          const degrees = cycles * 360;
          tooth.querySelector("[data-degrees]").textContent = `${degrees}°`;
          tooth.querySelector(".phase-arrow").style.setProperty("--angle", `${-degrees}deg`);
        }
      }

      function restore(state) {
        const packet = state?.modelContent?.weightPacket;
        if (Number.isInteger(packet) && packet >= 1 && packet <= teethCount) {
          input.value = packet;
        }
        draw();
      }

      input.addEventListener("input", draw);
      input.addEventListener("change", () => {
        window.openai?.setWidgetState?.({
          modelContent: { weightPacket: input.valueAsNumber },
          privateContent: null
        })?.catch(() => {});
      });
      window.addEventListener("openai:set_globals", event => {
        restore(event.detail?.globals?.widgetState);
      });
      restore(window.openai?.widgetState);
    })();
  </script>
</div>
