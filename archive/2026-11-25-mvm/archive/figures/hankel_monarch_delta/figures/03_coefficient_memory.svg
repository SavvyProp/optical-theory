<text x="650" y="170" font-size="22" fill="#7c3aed" font-weight="400" text-anchor="start">s = 0 … 2K−2</text>
<text x="1040" y="170" font-size="19" fill="#475569" font-weight="400" text-anchor="start">2K−1 coherent coefficient lines / slot</text>
