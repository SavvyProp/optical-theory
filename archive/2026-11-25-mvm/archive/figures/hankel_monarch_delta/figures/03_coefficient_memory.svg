<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">Direct pump-band recirculating coefficient memory</title>
<desc id="desc">Each temporal slot stores all 2K minus 1 independent Hankel coefficient fields directly in pump band P, with frequencies omega A plus omega B plus s Delta. A read tap supplies the Hankel DFG without translation. The gradient cross-SFG already generates band P; a whole-band filter and scalar amplitude and phase setting feed a coherent injection coupler. The forgetting field gate is applied once per active token. Persistent coefficients bypass nonlinear compute sections and circulate unchanged by the model on idle laps, although physical loss and phase noise remain. No memory lifetime or energy budget is established.</desc>
<defs>
<marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#0f766e"/></marker>
<marker id="arrow-pump" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#7c3aed"/></marker>
<marker id="arrow-error" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#be123c"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#b45309"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#475569"/></marker>
</defs>
