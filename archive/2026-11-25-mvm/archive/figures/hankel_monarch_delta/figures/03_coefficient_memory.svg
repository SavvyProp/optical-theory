<text x="200" y="755" font-size="20" fill="#7c3aed" font-weight="600" text-anchor="start">Coherent injection: a⁺ = αa + ηg</text>
<rect x="950" y="225" width="610" height="235" rx="20" fill="white" stroke="#dbe3ec" stroke-width="1.7"/>
<text x="975" y="262" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">DIRECT READ ACCESS</text>
<text x="975" y="293" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Persistent coefficients stay out of the nonlinear compute path.</text>
<path d="M850 405 H1010" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pump)"/>
<rect x="1010" y="330" width="490" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="1255.0" y="362" font-size="22" fill="#7c3aed" font-weight="700" text-anchor="middle">Pump copy → Hankel DFG</text>
<text x="1255.0" y="389" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">Read a⁻ for prediction or a⁺ for updated query</text>
<text x="1255.0" y="413" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">Band P in → band P pump; no translator</text>
<rect x="950" y="490" width="610" height="340" rx="20" fill="white" stroke="#dbe3ec" stroke-width="1.7"/>
<text x="975" y="527" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">OPTICAL WRITE ACCESS</text>
<text x="975" y="558" font-size="18" fill="#475569" font-weight="400" text-anchor="start">The gradient already occupies the stored coefficient band.</text>
<rect x="985" y="575" width="220" height="108" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="1095.0" y="607" font-size="21" fill="#7c3aed" font-weight="700" text-anchor="middle">Cross-SFG</text>
<text x="1095.0" y="634" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">k in A + r in B</text>
<text x="1095.0" y="658" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">gₘ = k ∗ rₘ</text>
<path d="M1205 629 H1245" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pump)"/>
<rect x="1245" y="575" width="275" height="108" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="1382.5" y="607" font-size="20" fill="#7c3aed" font-weight="700" text-anchor="middle">Whole-band filter</text>
<text x="1382.5" y="634" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">Keep all 2K−1 P lines</text>
<text x="1382.5" y="658" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">Reject seeds / self-SFG</text>
<path d="M1382 683 V710" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pump)"/>
<rect x="1245" y="710" width="275" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
<text x="1382.5" y="742" font-size="20" fill="#7c3aed" font-weight="700" text-anchor="middle">Scalar η + phase</text>
<text x="1382.5" y="769" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">Calibrate injection amplitude</text>
<path d="M1382 800 V865 H115 V690" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-pump)"/>
<text x="490" y="849" font-size="21" fill="#7c3aed" font-weight="600" text-anchor="start">Δa in the same pump band P</text>
<rect x="40" y="915" width="1520" height="185" rx="20" fill="white" stroke="#dbe3ec" stroke-width="1.7"/>
<text x="65" y="952" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">RETENTION AND TIMING REQUIREMENTS</text>
<text x="65" y="990" font-size="19" fill="#475569" font-weight="400" text-anchor="start">• Apply α before the residual read, once per active token; use unity gate on idle / replay laps.</text>
<text x="65" y="1023" font-size="19" fill="#475569" font-weight="400" text-anchor="start">• Keep compute on access branches. Idle circulation still accumulates physical loss, phase error and any amplifier noise.</text>
<text x="65" y="1056" font-size="19" fill="#475569" font-weight="400" text-anchor="start">• Read taps and passive injection couplers attenuate fields; calibrate both loop and write amplitudes before claiming a⁺.</text>
<text x="40" y="1132" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Schematic only. Access times, pump-band fiber, loss compensation, phase locking and optical memory lifetime require validation.</text>
</g>
