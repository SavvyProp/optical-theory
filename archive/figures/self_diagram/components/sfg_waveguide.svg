<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="960" height="240" viewBox="0 0 960 240"
     version="1.1" role="img" aria-labelledby="sfg-title sfg-description">
  <title id="sfg-title">SFG nonlinear waveguide — top view</title>
  <desc id="sfg-description">Editable conceptual component for the Hankel
    multiplier's optical coefficient writer. A single straight waveguide carries
    two already-combined input fields through a second-order nonlinear
    interaction region. The generated sum-frequency field shares the output
    with the remaining input fields. The upstream combiner and downstream filter
    are separate components. Alternating teal domains illustrate an optional
    periodically poled implementation; they are not electrodes or etched
    grooves. Geometry, widths, domain count and pitch are schematic, with no
    physical scale implied. Hide the Annotations layer for a plain component;
    hide Periodic poling for an unpatterned nonlinear region. All artwork is
    native editable SVG. The illustration matches the DFG component's style;
    it does not specify identical physical phase-matching designs. Teal identifies
    SFG in the diagram, while purple identifies DFG; these are illustrative
    operation colors, not material colors or emitted wavelengths.</desc>

  <defs>
    <marker id="sfg-flow-arrow" markerWidth="9" markerHeight="8"
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 9,4 L 0,8 Z" fill="#516176"/>
    </marker>
  </defs>

  <!-- A continuous shared guide: no implicit wavelength separation. -->
  <g id="sfg-geometry" inkscape:groupmode="layer" inkscape:label="Waveguide geometry">
    <rect id="sfg-access-guide" x="64" y="98" width="832" height="44"
          fill="#e3e8ef"/>
    <rect id="sfg-nonlinear-region" x="224" y="98" width="512" height="44"
          fill="#d7eee8"/>

    <!-- Optional domain inversion, deliberately schematic and easy to hide. -->
    <g id="sfg-periodic-poling" inkscape:groupmode="layer"
       inkscape:label="Periodic poling (optional)" fill="#8fc6b7">
      <rect id="sfg-domain-01" x="224" y="98" width="32" height="44"/>
      <rect id="sfg-domain-02" x="288" y="98" width="32" height="44"/>
      <rect id="sfg-domain-03" x="352" y="98" width="32" height="44"/>
      <rect id="sfg-domain-04" x="416" y="98" width="32" height="44"/>
      <rect id="sfg-domain-05" x="480" y="98" width="32" height="44"/>
      <rect id="sfg-domain-06" x="544" y="98" width="32" height="44"/>
      <rect id="sfg-domain-07" x="608" y="98" width="32" height="44"/>
      <rect id="sfg-domain-08" x="672" y="98" width="32" height="44"/>
    </g>

    <path id="sfg-active-boundaries" d="M 224,98 V 142 M 736,98 V 142"
          fill="none" stroke="#538c7c" stroke-width="1.5"/>
    <rect id="sfg-guide-outline" x="64" y="98" width="832" height="44"
          fill="none" stroke="#455267" stroke-width="1.75"/>
  </g>

  <!-- Keep this layer outside any later projection of the geometry. -->
  <g id="sfg-annotations" inkscape:groupmode="layer" inkscape:label="Annotations"
     font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#253246">
    <text id="sfg-input-label" x="64" y="62">Input 1 + input 2</text>
    <text id="sfg-operation-label" x="480" y="62" text-anchor="middle"
          font-size="23" font-weight="600" fill="#216f60">SFG · χ²</text>
    <text id="sfg-output-label" x="896" y="62" text-anchor="end">Mixed output</text>

    <g id="sfg-flow-indicators" fill="none" stroke="#516176" stroke-width="1.6">
      <path id="sfg-input-flow" d="M 64,81 H 200" marker-end="url(#sfg-flow-arrow)"/>
      <path id="sfg-output-flow" d="M 760,81 H 896" marker-end="url(#sfg-flow-arrow)"/>
    </g>

    <g id="sfg-component-notes" font-size="14" fill="#647087">
      <text id="sfg-input-note" x="64" y="174">Already combined</text>
      <text id="sfg-output-note" x="896" y="174" text-anchor="end">Inputs + generated field</text>
      <path id="sfg-poling-leader" d="M 480,147 V 165"
            fill="none" stroke="#6b9f91" stroke-width="1.2"/>
      <text id="sfg-poling-note" x="480" y="184" text-anchor="middle">Periodic domain inversion (schematic)</text>
    </g>
    <text id="sfg-frequency-relation" x="480" y="219" text-anchor="middle"
          font-size="18" fill="#216f60">ω₃ = ω₁ + ω₂</text>
  </g>
</svg>
