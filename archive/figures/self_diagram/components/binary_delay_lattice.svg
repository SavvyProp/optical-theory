<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="296" height="160" viewBox="0 0 296 160"
     version="1.1" role="img" aria-labelledby="bdl-title bdl-description">
  <title id="bdl-title">Binary delay lattice — compact optical symbol</title>
  <desc id="bdl-description">Editable, annotation-free functional symbol for
    the passive binary delay lattice. Three representative split-delay-recombine
    stages use interleaved spiral waveguides with central S bends. Each delay
    is one continuous path with two external ends; the access bends run outside
    its windings. Increasing spiral radii and winding counts suggest increasing
    delays, without specifying physical delay ratios. The current seven-stage
    design is specified in cell_pathways.md: differential delays tau, 2 tau,
    4 tau, 8 tau, 16 tau, 32 tau and 64 tau, with fourteen couplers. This
    three-stage motif abbreviates that network; it is not its complete physical
    layout. At each depicted stage, two small coupler bars connect a direct arm
    and a delayed arm. The splitter's upper input and the recombiner's upper
    output have short terminated stubs. The lower selected output feeds the
    next stage. Coupler phases are assumed calibrated for addition. The ideal
    selected transfer of the full lattice is the product of (1 + D^(2^j))/2
    for j from 0 to 6, where D is a one-slot delay. Delays and bends are
    schematic, not to scale. No gain, fast switching or physical phase trim
    implementation is depicted. Short external fiber stubs have pale gray
    cladding and blue cores with no outer outlines. All artwork is native
    editable SVG on a transparent background. Fiber connections, body and
    lattice motif are separate Inkscape layers.</desc>

