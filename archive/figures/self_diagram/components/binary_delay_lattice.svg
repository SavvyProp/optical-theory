      <rect id="bdl-output-guide" x="268" y="110" width="18" height="16"/>
    </g>
    <g id="bdl-access-cores" fill="none" stroke="#5d8db4" stroke-width="3.5">
      <path id="bdl-input-core" d="M 10,118 H 28"/>
      <path id="bdl-output-core" d="M 268,118 H 286"/>
    </g>
  </g>

