<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1580" viewBox="0 0 1800 1580" role="img" aria-labelledby="title desc">
<title id="title">Preliminary footprint budget for a single-lattice Hankel reader</title><desc id="desc">Illustrative scaled area reservations inside a six by two millimeter reader die, totaling twelve square millimeters. Two DFG strips each five by 0.15 millimeters occupy 1.5 square millimeters together. One binary lattice reserves two square millimeters, filters, combiners and transitions reserve 1.5 square millimeters, and seven square millimeters remains for routing, optical access, clearance and placement. There are no reader electro-optic switch corridors. The preliminary reader planning range is eight to fifteen square millimeters. Optional writer arithmetic adds approximately one to two square millimeters of component reservations, but a complete writer footprint is not established because memory access and replay controls are not included. External pumps, encoders, fiber memory, replay buffers and electronics are excluded. This is an area budget, not a routed or fabrication-ready floorplan.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#0f766e"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#7c3aed"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#475569"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9 Z" fill="#be123c"/></marker>
</defs>
