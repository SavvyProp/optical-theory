<text x="76" y="1315" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">OPTIONAL WRITER IS OUTSIDE THE BASELINE READER BUDGET</text>
<text x="76" y="1359" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Writer arithmetic adds roughly 1–2 mm² of component reservations for SFG and gradient / injection optics.</text>
<text x="76" y="1401" font-size="21" fill="#475569" font-weight="400" text-anchor="start">A complete writer footprint remains open: memory access, replay and control architecture are not included.</text>
<text x="76" y="1444" font-size="21" fill="#475569" font-weight="400" text-anchor="start">External comb sources, data encoders, fiber memory, replay buffers, electronics and Monarch shuffle are excluded.</text>
<text x="48" y="1514" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Length precedent: 4.8 mm poled DFG device (Koyaz et al., 2024). Footprint is a preliminary planning range, not measured silicon.</text>
<text x="48" y="1551" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Source links and packing assumptions: photonic_component.md → Preliminary footprint estimate.</text>
