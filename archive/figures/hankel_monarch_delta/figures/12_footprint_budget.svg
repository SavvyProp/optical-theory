<text x="80" y="1180" font-size="22" fill="#475569" font-weight="600" text-anchor="start">Routing / access / clearance reserve: 7 mm²</text>
<text x="80" y="1215" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Reader block subtotal: 5 mm². The standalone die allowance is larger to fit these blocks and optical access.</text>
